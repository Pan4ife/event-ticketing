spring.application.name=event-ticketing

# Local PostgreSQL. Override with environment variables in other environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/event_ticketing}
spring.datasource.username=${DB_USERNAME:event_ticketing}
spring.datasource.password=${DB_PASSWORD:event_ticketing}

# Schema is owned by Flyway migrations (src/main/resources/db/migration), not by Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Only the health endpoint is public: GET /actuator/health
management.endpoints.web.exposure.include=health
